name: Build CarPlay App
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          xcodebuild -project CarTube.xcodeproj -scheme CarTube -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build CONFIGURATION_BUILD_DIR=build
          mkdir -p Payload
          cp -r build/CarTube.app Payload/
          zip -r BikeMaps.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BikeMaps-IPA
          path: BikeMaps.ipa
